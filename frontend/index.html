<!DOCTYPE html>
<html>
<head>
  <title>Benny's Restaurant</title>

  <link
    rel="stylesheet"
    href="style.css"
  />

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<div class="phone-frame">

  <div class="top-bar">

    <div class="profile-section">

      <img
        class="avatar"
        src="https://i.imgur.com/IAgGUYF.png"
      />

      <div>

        <div class="restaurant-name">
          Benny's Restaurant
        </div>

        <div class="status">
          online
        </div>

      </div>

    </div>

  </div>

  <div
    id="chat-box"
    class="chat-box"
  >

    <div class="message bot">

      <div class="message-text">
        Halo 👋 Welcome to Benny's Restaurant.
      </div>

      <div class="time">
        10:20
      </div>

    </div>

  </div>

  <div class="quick-actions">

    <button onclick="quickMessage('menu')">
      🍽 Menu
    </button>

    <button onclick="quickMessage('promo')">
      🎉 Promo
    </button>

    <button onclick="quickMessage('reservation')">
      📅 Reservation
    </button>

    <button onclick="quickMessage('delivery')">
      🛵 Delivery
    </button>

  </div>

  <div class="input-area">

    <input
      type="text"
      id="user-input"
      placeholder="Type a message"
    />

    <button onclick="sendMessage()">
      ➤
    </button>

  </div>

</div>

<script src="script.js"></script>

</body>
</html>
